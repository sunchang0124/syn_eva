[project]
name = "syneva"
version = "0.1.0a0"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Chang Sun", email = "chang.sun@maastrichtuniversity.nl"}]
description = "7 Cs scorecard for tabular synthetic data evaluation."
readme = "README.md"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "jinja2>=3.1",
  "typer>=0.12",
  "pydantic>=2.7",
]

[project.optional-dependencies]
pdf = ["weasyprint>=62"]
plotly = ["plotly>=5.20"]
all = ["syneva[pdf,plotly]"]

[project.scripts]
syn-eva = "syneva.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syneva"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.0",
  "ruff>=0.5",
  "pyright>=1.1.380",
  "pre-commit>=3.7",
  "beautifulsoup4>=4.12",
  "pyarrow>=24.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src/syneva", "tests"]
pythonVersion = "3.10"
strict = ["src/syneva"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that take >1s"]
