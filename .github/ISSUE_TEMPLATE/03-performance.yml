name: Performance
description: Excessive runtime or memory use.
title: "[Perf]: "
labels: ["performance", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Maintainers set severity and area labels during triage.
  - type: textarea
    id: area
    attributes:
      label: Affected area
      description: |
        Where the problem is, as precisely as you know. A file and line, several files, a module (e.g. `syneva.compliance`), or a component (e.g. the HTML report, the CLI). Leave empty if you're not sure.
      placeholder: |
        src/syneva/compliance/extended/mia.py:52
        or: the benchmark ranking
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is slow or memory-hungry, and why.
    validations:
      required: true
  - type: input
    id: size
    attributes:
      label: Input size
      description: Rows and columns of real and synthetic data.
      placeholder: real 50k x 30, synthetic 50k x 30
  - type: textarea
    id: observed
    attributes:
      label: Observed time / memory
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
