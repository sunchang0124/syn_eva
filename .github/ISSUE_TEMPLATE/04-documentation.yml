name: Documentation
description: Wrong, missing, or unclear docs, docstrings, or metric descriptions.
title: "[Docs]: "
labels: ["documentation", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Maintainers set severity and area labels during triage.
  - type: textarea
    id: area
    attributes:
      label: Affected area
      description: |
        Where the docs are, or where they should be. A file, a docstring, a README section, a metric description in the report, or a topic that has no docs yet.
      placeholder: |
        src/syneva/core/metric_info.py, novelty_rate
        or: README, nothing explains how to pass a holdout
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What's wrong or missing
    validations:
      required: true
  - type: textarea
    id: correct
    attributes:
      label: Correct text
